<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runner's High Game | Rising Hempire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D08;
    --bg-elev:#14170E;
    --bg-elev-2:#1B1F13;
    --line:#2B2F20;
    --gold:#D4A72C;
    --gold-bright:#F0C339;
    --green:#8FE619;
    --cream:#F1EEE1;
    --muted:#9C9C8C;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));}
  body{
    margin:0;background:var(--bg);color:var(--cream);
    font-family:'Work Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.02em;line-height:.95;margin:0;}
  a{color:inherit}
  img{max-width:100%;display:block}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}

  /* ---------- Nav ---------- */
  header.nav{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
    background:rgba(11,13,8,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{max-width:1180px;margin:0 auto;padding:8px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .nav-inner img{height:46px;width:auto}
  .nav-links{display:flex;gap:28px;font-size:14.5px;font-weight:500}
  .nav-links a{text-decoration:none;color:var(--cream);opacity:.8;transition:opacity .15s,color .15s}
  .nav-links a:hover{opacity:1;color:var(--green)}
  .nav-cta{background:var(--gold);color:#111;padding:9px 18px;border-radius:3px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
  .nav-cta:hover{background:var(--gold-bright)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--cream);width:40px;height:40px;border-radius:3px;font-size:18px;cursor:pointer}


  }
.game-section {
  width: 100%;
  max-width: 1400px;
  margin: 30px auto;
  padding: 20px;
  box-sizing: border-box;
  text-align: center;
}

.game-section h1 {
  color: #fff;
  margin-bottom: 20px;
}

.game-frame {
  display: block;
  width: 100%;
  height: min(80vh, 800px);
  min-height: 450px;
  border: none;
  border-radius: 12px;
  background: #080808;
}

@media (max-width: 768px) {
  .game-section {
    padding: 10px;
  }

  .game-frame {
    height: 75dvh;
    min-height: 400px;
  }
  
  }

  /* ---------- Footer ---------- */
  footer{padding:56px 0 40px}
  .foot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;flex-wrap:wrap;padding-bottom:36px;border-bottom:1px solid var(--line)}
  footer img.foot-logo{height:40px;width:auto;margin-bottom:14px}
  footer .foot-col b{display:block;font-size:14px;margin-bottom:14px;color:var(--cream)}
  footer .foot-col a{display:block;font-size:14px;color:var(--muted);text-decoration:none;margin-bottom:10px}
  footer .foot-col a:hover{color:var(--green)}
  .foot-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:22px;font-size:12.5px;color:var(--muted)}
  .social{display:flex;gap:10px}
  .social a{width:34px;height:34px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center}
  .social svg{width:16px;height:16px;fill:var(--muted)}
  .social a:hover svg{fill:var(--green)}

  /* ---------- Mobile ---------- */
  @media (max-width:860px){
    .nav-links{display:none}
    .menu-btn{display:block}
    .foot-top{flex-direction:column}
  }
</style>
</head>
